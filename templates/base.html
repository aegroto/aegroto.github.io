<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page is defined and page.title %}{{ page.title }} — {% elif section.title and not section.is_index %}{{ section.title }} — {% endif %}{{ config.title }}</title>
  <meta name="description" content="{% if page is defined and page.description %}{{ page.description }}{% elif section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}" />
  <meta name="author" content="{{ config.author }}" />
  <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◍</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="avatar avatar--small has-photo" href="{{ get_url(path='/') }}" aria-label="Homepage">
          <img src="{{ get_url(path=config.extra.avatar) }}" alt="aegroto GitHub avatar" width="40" height="40" />
        </a>
        <div class="brand-text">
          <a class="name name--small" href="{{ get_url(path='/') }}">{{ config.extra.name }}</a>
          <p class="affil affil--small">{{ config.extra.affiliation_short }}</p>
        </div>
      </div>

      <nav class="menu" aria-label="Main menu">
        <ul>
          {% for item in config.extra.menu %}
          {% set item_url = get_url(path=item.url) %}
          <li>
            <a href="{{ item_url }}"
               {% if current_path and current_path == item.url %}class="active" aria-current="page"{% endif %}>{{ item.name }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <div class="layout layout--top">
    <main class="content">
      {% block content %}{% endblock content %}
      <footer class="footer">
        <ul class="footer-links">
          <li><a href="{{ config.extra.scholar }}">Google Scholar</a></li>
          <li><a href="{{ config.extra.github }}">GitHub</a></li>
          <li><a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a></li>
        </ul>
      </footer>
    </main>
  </div>
</body>
</html>
